[package]
name = "sanskrit-lab-backend"
version = "0.2.0"
edition = "2021"

[features]
default = []
server = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "sanskrit-lab-backend"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-multipart = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "1"
futures-util = "0.3"